name: Echo 123 on Push





on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [job_trigger]


    


jobs:
  print-number:
    # Sử dụng máy chủ ảo Ubuntu mới nhất của GitHub
    runs-on: ubuntu-latest

    steps:
      - name: In ra số 123
        run: echo "123"