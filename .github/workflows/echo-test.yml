name: Echo 123 on Push

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [job_trigger]

jobs:
  print-number:
    runs-on: ubuntu-latest

    steps:
      - name: In ra số 123
        run: echo "123"

      - name: In payload từ API (tùy chọn)
        if: github.event_name == 'repository_dispatch'
        run: echo "Payload nhận được là ${{ github.event.client_payload.message }}"